name: Daily Fundamental Valuation Engine

on:
  schedule:
    # Runs at 21:30 UTC on weekdays (5:30 PM EDT / 4:30 PM EST): after the NYSE and TSX close at 4 PM ET, so
    # prices are closing prices like the reconstructed history. Weekends and holidays are skipped by the script.
    - cron: '30 21 * * 1-5'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

permissions:
  contents: write
  issues: write

concurrency:
  group: "valuation-run"
  cancel-in-progress: false

jobs:
  evaluate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Unit Tests
        run: |
          python -m unittest discover -s tests -v

      - name: Run Dashboard Logic Tests
        run: node --test tests/decision.test.js

      - name: Update Universe (SP500, QQQ, XIC, Custom ETFs)
        run: |
          python scripts/update_universe.py

      - name: Run Daily Valuation & Save Snapshots
        env:
          # Set a repository variable SEC_USER_AGENT like "Your Name your@email.com" (SEC fair-access policy)
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: |
          python scripts/fetch_and_evaluate.py

      - name: Commit and Push Snapshot JSONs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Automated daily valuation snapshot: $(date -u +'%Y-%m-%d')"
          # Retry with a rebase in case another push landed while the run was in progress
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((attempt * 5))
          done
          echo "Could not push after 3 attempts" >&2
          exit 1

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Daily valuation run failed"
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again: $url"
          else
            gh issue create --title "$title" --body "The scheduled run failed: $url"
          fi
